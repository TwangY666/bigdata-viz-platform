<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>区域订单 · 分析工作台设计示意</title>
<style>
*{box-sizing:border-box}
:root{font:15px/1.55 "Segoe UI","Microsoft YaHei",sans-serif;color:#182e31;background:#f2f5f4;--accent:#12695e;--line:#d4dedb;font-variant-numeric:tabular-nums}
body{margin:0}button,select{font:inherit;color:inherit}button{cursor:pointer}
header{height:62px;background:#193a37;color:white;display:flex;align-items:center;padding:0 24px;gap:14px}header strong{font-size:18px}header small{margin-left:auto;color:#d6e6e1}
.mark{height:25px;width:25px;display:flex;gap:3px;align-items:end}.mark i{width:5px;background:#a5e3bc}.mark i:nth-child(1){height:38%}.mark i:nth-child(2){height:70%}.mark i:nth-child(3){height:98%}
.layout{display:grid;grid-template-columns:155px minmax(0,1fr) 270px;min-height:calc(100vh - 62px)}
nav{padding:28px 10px;background:#e9efed;border-right:1px solid var(--line)}nav button{display:block;border:0;background:transparent;text-align:left;width:100%;padding:12px 16px;margin-bottom:5px;border-radius:5px}nav button[aria-pressed=true]{background:#d2e7de;color:#134f45;font-weight:650}
main{padding:clamp(20px,3.5vw,54px);min-width:0}h1{font-size:clamp(28px,3vw,41px);letter-spacing:-.045em;margin:0}h2{font-size:21px;margin:0}.meta,dt,small{color:#506660}.meta{margin:4px 0 29px}
article{background:white;border:1px solid var(--line);border-radius:8px;padding:clamp(18px,2.5vw,36px)}article header{all:unset}
.total{border-top:1px solid var(--line);display:flex;align-items:baseline;justify-content:space-between;padding-top:15px;margin-top:26px}.total b{font-size:21px}
.chart{padding:24px 0 18px}.row{display:grid;grid-template-columns:74px minmax(0,1fr) 62px;align-items:center;gap:12px;min-height:57px}.row b{text-align:right}.track{height:26px;border-left:1px solid #a0b1ac;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(25% - 1px),#e5ebe9 calc(25% - 1px),#e5ebe9 25%)}.bar{height:100%;display:block;background:#217467;border-radius:0 3px 3px 0}
aside{background:#fcfdfc;border-left:1px solid var(--line);padding:30px 20px}aside h2{font-size:17px;margin-bottom:22px}label{display:block;margin:0 0 18px;font-size:14px;color:#425952}select{display:block;width:100%;border:1px solid #a8bab3;border-radius:5px;background:white;padding:9px;margin-top:5px}.filter{border-top:1px solid var(--line);padding-top:18px}p{margin:6px 0}table{border-collapse:collapse;width:100%}td,th{text-align:left;border-bottom:1px solid var(--line);padding:12px 8px;white-space:nowrap}td:last-child,th:last-child{text-align:right}.scroll{overflow:auto}button:focus-visible,select:focus-visible{outline:3px solid #2f847d;outline-offset:2px}
@media(max-width:1024px){.layout{grid-template-columns:106px minmax(0,1fr) 208px}main{padding:24px 16px}nav button{padding:10px}}
@media(max-width:730px){.layout{display:flex;flex-direction:column}nav{display:flex;padding:8px}nav button{width:auto;margin:0}aside{border-top:1px solid var(--line)}}
</style>
<header><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span><strong>数据工作台</strong><small>交互示意 · 内置样例</small></header>
<div class="layout">
  <nav aria-label="工作视图"><button id="report" aria-pressed="true">分析报表</button><button id="detail" aria-pressed="false">数据明细</button></nav>
  <main><h1>区域订单</h1><p class="meta" id="meta"></p><article><h2 id="title"></h2><div id="content"></div><div class="total"><span>所选订单合计</span><b id="total"></b></div></article></main>
  <aside aria-label="图表设置"><h2>图表设置</h2>
    <label>分组<select id="group"><option value="region">区域</option><option value="month">月份</option></select></label>
    <label>数值<select id="measure"><option value="amount">销售额（元）</option><option value="count">订单数（笔）</option></select></label>
    <label>汇总方式<select id="agg"><option value="sum">求和</option><option value="avg">平均</option></select></label>
    <label class="filter">筛选月份<select id="filter"><option value="">全部月份</option><option>2026-01</option><option>2026-02</option></select></label>
  </aside>
</div>
<script>
const orders=[
  {id:'00123',month:'2026-01',region:'华东',amount:1200},
  {id:'00124',month:'2026-01',region:'华南',amount:600},
  {id:'00125',month:'2026-02',region:'华东',amount:800},
  {id:'00126',month:'2026-02',region:'华南',amount:400}
];
const el=id=>document.getElementById(id);
const number=new Intl.NumberFormat('zh-CN');
let view='report';
function render(){
  const rows=orders.filter(order=>!el('filter').value || order.month===el('filter').value);
  const sum=rows.reduce((total,order)=>total+order.amount,0);
  const groupedBy=el('group').value;
  const counting=el('measure').value==='count';
  el('agg').disabled=counting;
  el('agg').options[0].text=counting?'计数':'求和';
  if(counting) el('agg').value='sum';
  const average=el('agg').value==='avg';
  el('report').setAttribute('aria-pressed',String(view==='report'));
  el('detail').setAttribute('aria-pressed',String(view==='detail'));
  el('meta').textContent='区域订单样例.csv · 4 个字段 · 当前显示 '+rows.length+' / 4 笔订单';
  el('total').textContent=number.format(sum)+' 元';
  if(view==='detail'){
    el('title').textContent='订单明细';
    el('content').innerHTML='<div class="scroll"><table><thead><tr><th>订单编号</th><th>月份</th><th>区域</th><th>销售额（元）</th></tr></thead><tbody>'+rows.map(r=>'<tr><td>'+r.id+'</td><td>'+r.month+'</td><td>'+r.region+'</td><td>'+number.format(r.amount)+'</td></tr>').join('')+'</tbody></table></div>';
    return;
  }
  const groups=new Map();
  for(const order of rows){
    const key=order[groupedBy];
    const item=groups.get(key)||{sum:0,count:0};
    item.sum+=order.amount;item.count++;groups.set(key,item);
  }
  const values=Array.from(groups,([label,item])=>({label,value:counting?item.count:average?item.sum/item.count:item.sum}));
  const max=Math.max(1,...values.map(item=>item.value));
  el('title').textContent=(groupedBy==='region'?'各区域':'各月')+(counting?'订单数':average?'平均每单销售额':'销售总额');
  el('content').innerHTML='<p><small>单位 · '+(counting?'笔':'元')+'</small></p><div class="chart">'+values.map(item=>'<div class="row"><span>'+item.label+'</span><div class="track" aria-hidden="true"><i class="bar" style="width:'+100*item.value/max+'%"></i></div><b>'+number.format(item.value)+'</b></div>').join('')+'</div>';
}
for(const id of ['group','measure','agg','filter']) el(id).addEventListener('change',render);
for(const id of ['report','detail']) el(id).addEventListener('click',()=>{view=id;render()});
render();
</script>
</html>
